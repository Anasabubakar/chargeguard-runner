name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run check:schema
      - run: pnpm test
      - run: pnpm run build
      - name: CLI exit codes
        run: |
          node dist/cli.js run repeated-credential --store sqlite --mode push > /dev/null
          set +e
          node dist/cli.js run repeated-credential --store memory --mode push > /dev/null
          test $? -eq 1
          node dist/cli.js run no-such-scenario 2> /dev/null
          test $? -eq 2
      - name: Deterministic suite on the stub chain
        run: node dist/cli.js suite --backend stub > /dev/null
